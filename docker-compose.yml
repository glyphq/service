name: glyph

# Shared application environment. Every value is overridable from the host
# environment or an .env file passed with --env-file.
x-app-env: &app-env
  CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
  CLICKHOUSE_DB: ${CLICKHOUSE_DB:-glyph}
  QUBIC_PEERS: ${QUBIC_PEERS:-157.180.10.49:21841}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_BUCKET: ${S3_BUCKET:-glyph-archive}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-glyph}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-glyph-dev-secret}
  S3_REGION: ${S3_REGION:-us-east-1}
  ARCHIVE_FAIL_CLOSED: ${ARCHIVE_FAIL_CLOSED:-false}
  ALLOW_BROADCAST: ${ALLOW_BROADCAST:-false}
  STREAM_POLL_MS: ${STREAM_POLL_MS:-1000}
  PRICE_POLL_MS: ${PRICE_POLL_MS:-60000}

x-clickhouse-env: &clickhouse-env
  CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
  CLICKHOUSE_DB: ${CLICKHOUSE_DB:-glyph}

x-glyph-image: &glyph-image
  build:
    context: .
    dockerfile: Dockerfile
  image: ${GLYPH_IMAGE:-glyph:local}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.11
    restart: unless-stopped
    environment:
      # The server creates this database on first start. `glyph db-init` also
      # creates it idempotently before the API and indexer start.
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-glyph}
    ports:
      # The default ClickHouse user has no password. Keep the HTTP endpoint on
      # loopback unless an authenticating proxy is in front of it.
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # MinIO's root credentials double as the S3 credentials used by Glyph.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-glyph}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-glyph-dev-secret}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  # One-shot bucket bootstrap. Safe to rerun on every `up`.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-glyph-archive}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-glyph}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-glyph-dev-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set glyph "$$S3_ENDPOINT" "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing "glyph/$$S3_BUCKET"
        mc version enable "glyph/$$S3_BUCKET" >/dev/null 2>&1 || true
        mc anonymous set none "glyph/$$S3_BUCKET" >/dev/null 2>&1 || true
        echo "bucket ready: $$S3_BUCKET"
    restart: "no"
    logging: *default-logging

  # Apply the schema once before either long-running process starts. The DDL is
  # CREATE ... IF NOT EXISTS, so this is safe on every stack start.
  migrate:
    <<: *glyph-image
    command: ["glyph", "db-init"]
    environment:
      <<: *clickhouse-env
      RUST_LOG: ${GLYPH_MIGRATE_LOG:-info}
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  api:
    <<: *glyph-image
    command: ["api"]
    environment:
      <<: *app-env
      BIND: ${BIND:-0.0.0.0:8080}
      RUST_LOG: ${GLYPH_API_LOG:-info,tower_http=info}
    ports:
      - "${API_HOST:-127.0.0.1}:${API_PORT:-8080}:8080"
    depends_on:
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # Derive the container port from BIND so overriding the listen address
      # does not silently break the health probe.
      test:
        - CMD-SHELL
        - curl -fsS --max-time 3 "http://127.0.0.1:$${BIND##*:}/healthz" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging

  indexer:
    <<: *glyph-image
    command: ["indexer"]
    environment:
      <<: *app-env
      RUST_LOG: ${GLYPH_INDEXER_LOG:-info}
      GLYPH_FROM_TICK: ${GLYPH_FROM_TICK:-}
      INDEXER_POLL_MS: ${INDEXER_POLL_MS:-750}
      INDEXER_PROGRESS_EVERY: ${INDEXER_PROGRESS_EVERY:-100}
      INDEXER_FETCH_CONCURRENCY: ${INDEXER_FETCH_CONCURRENCY:-32}
      INDEXER_FETCH_WINDOW: ${INDEXER_FETCH_WINDOW:-512}
      INDEXER_WRITE_BATCH: ${INDEXER_WRITE_BATCH:-128}
      INDEXER_WRITE_FLUSH_MS: ${INDEXER_WRITE_FLUSH_MS:-250}
      INDEXER_DISCOVER_PEERS: ${INDEXER_DISCOVER_PEERS:-false}
      GLYPH_VERIFY_SIGNATURES: ${GLYPH_VERIFY_SIGNATURES:-true}
    depends_on:
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # There is no HTTP surface. PID 1 is the glyph process because the
      # entrypoint uses exec, so this is a process-liveness probe.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging

volumes:
  clickhouse-data:
  clickhouse-logs:
  minio-data:

networks:
  default:
    name: glyph
