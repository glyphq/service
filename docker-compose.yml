name: glyph

# Shared application environment. Every value is overridable from the host
# environment or an .env file passed with --env-file.
x-app-env: &app-env
  CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://glyph:glyph-dev-secret@clickhouse:8123}
  CLICKHOUSE_DB: ${CLICKHOUSE_DB:-glyph}
  QUBIC_PEERS: ${QUBIC_PEERS:-157.180.10.49:21841}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
  S3_BUCKET: ${S3_BUCKET:-glyph-archive}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-glyph}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-glyph-dev-secret}
  S3_REGION: ${S3_REGION:-us-east-1}
  ARCHIVE_FAIL_CLOSED: ${ARCHIVE_FAIL_CLOSED:-false}
  ALLOW_BROADCAST: ${ALLOW_BROADCAST:-false}
  BROADCAST_PEERS: ${BROADCAST_PEERS:-8}
  MEMPOOL_ENABLED: ${MEMPOOL_ENABLED:-true}
  MEMPOOL_POLL_MS: ${MEMPOOL_POLL_MS:-500}
  MEMPOOL_RETRY_MS: ${MEMPOOL_RETRY_MS:-1000}
  MEMPOOL_MAX_ATTEMPTS: ${MEMPOOL_MAX_ATTEMPTS:-10}
  MEMPOOL_EXPIRY_TICKS: ${MEMPOOL_EXPIRY_TICKS:-10}
  MEMPOOL_MAX_ENTRIES: ${MEMPOOL_MAX_ENTRIES:-10000}
  MEMPOOL_MAX_PER_SOURCE: ${MEMPOOL_MAX_PER_SOURCE:-100}
  WEBHOOK_TIMEOUT_MS: ${WEBHOOK_TIMEOUT_MS:-5000}
  WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-6}
  WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-false}
  WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-}
  STREAM_POLL_MS: ${STREAM_POLL_MS:-1000}
  PRICE_POLL_MS: ${PRICE_POLL_MS:-60000}
  MARKET_ENABLED: ${MARKET_ENABLED:-true}
  MARKET_POLL_MS: ${MARKET_POLL_MS:-5000}
  COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}

x-clickhouse-env: &clickhouse-env
  CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
  CLICKHOUSE_DB: ${CLICKHOUSE_DB:-glyph}

x-glyph-image: &glyph-image
  build:
    context: .
    dockerfile: Dockerfile
  image: ${GLYPH_IMAGE:-glyph:local}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      # The server creates this database on first start. `glyph db-init` also
      # creates it idempotently before the API and indexer start.
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-glyph}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-glyph}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-glyph-dev-secret}
    ports:
      # The default ClickHouse user has no password. Keep the HTTP endpoint on
      # loopback unless an authenticating proxy is in front of it.
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  # SeaweedFS provides the S3-compatible API. MinIO stopped publishing
  # community images to Docker Hub, so the stack uses SeaweedFS instead.
  s3-config:
    image: busybox:1.36
    restart: "no"
    command:
      - sh
      - -c
      - |
        printf '%s' '{"identities":[{"name":"glyph","credentials":[{"accessKey":"'"$${S3_ACCESS_KEY}"'","secretKey":"'"$${S3_SECRET_KEY}"'"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /config/s3.json
        chmod 600 /config/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-glyph}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-glyph-dev-secret}
    volumes:
      - seaweedfs-config:/config
    logging: *default-logging

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
      - seaweedfs-config:/etc/seaweedfs:ro
    depends_on:
      s3-config:
        condition: service_completed_successfully
    logging: *default-logging

  # One-shot bucket bootstrap. Safe to rerun on every `up`.
  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      seaweedfs:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-glyph}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-glyph-dev-secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_BUCKET: ${S3_BUCKET:-glyph-archive}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for attempt in $$(seq 1 60); do
          if aws --endpoint-url "$$S3_ENDPOINT" s3api head-bucket --bucket "$$S3_BUCKET" >/dev/null 2>&1; then
            echo "bucket ready: $$S3_BUCKET"
            exit 0
          fi
          aws --endpoint-url "$$S3_ENDPOINT" s3api create-bucket --bucket "$$S3_BUCKET" >/dev/null 2>&1 || true
          sleep 2
        done
        echo "bucket bootstrap failed" >&2
        exit 1
    restart: "no"
    logging: *default-logging

  # Apply the schema once before either long-running process starts. The DDL is
  # CREATE ... IF NOT EXISTS, so this is safe on every stack start.
  migrate:
    <<: *glyph-image
    command: ["glyph", "db-init"]
    environment:
      <<: *clickhouse-env
      RUST_LOG: ${GLYPH_MIGRATE_LOG:-info}
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  api:
    <<: *glyph-image
    command: ["api"]
    environment:
      <<: *app-env
      BIND: ${BIND:-0.0.0.0:8080}
      RUST_LOG: ${GLYPH_API_LOG:-info,tower_http=info}
    ports:
      - "${API_HOST:-127.0.0.1}:${API_PORT:-8080}:8080"
    depends_on:
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      # Derive the container port from BIND so overriding the listen address
      # does not silently break the health probe.
      test:
        - CMD-SHELL
        - curl -fsS --max-time 3 "http://127.0.0.1:$${BIND##*:}/healthz" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging

  indexer:
    <<: *glyph-image
    command: ["indexer"]
    environment:
      <<: *app-env
      RUST_LOG: ${GLYPH_INDEXER_LOG:-info}
      GLYPH_FROM_TICK: ${GLYPH_FROM_TICK:-}
      INDEXER_POLL_MS: ${INDEXER_POLL_MS:-750}
      INDEXER_PROGRESS_EVERY: ${INDEXER_PROGRESS_EVERY:-100}
      INDEXER_FETCH_CONCURRENCY: ${INDEXER_FETCH_CONCURRENCY:-32}
      INDEXER_FETCH_WINDOW: ${INDEXER_FETCH_WINDOW:-512}
      INDEXER_WRITE_BATCH: ${INDEXER_WRITE_BATCH:-128}
      INDEXER_WRITE_FLUSH_MS: ${INDEXER_WRITE_FLUSH_MS:-250}
      INDEXER_DISCOVER_PEERS: ${INDEXER_DISCOVER_PEERS:-false}
      GLYPH_VERIFY_SIGNATURES: ${GLYPH_VERIFY_SIGNATURES:-false}
    depends_on:
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      # There is no HTTP surface. PID 1 is the glyph process because the
      # entrypoint uses exec, so this is a process-liveness probe.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging

volumes:
  clickhouse-data:
  clickhouse-logs:
  seaweedfs-data:
  seaweedfs-config:

networks:
  default:
    name: glyph
