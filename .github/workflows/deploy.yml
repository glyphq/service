name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: glyph:local

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image
        run: docker run --rm $IMAGE glyph --version

      - name: Export image
        run: docker save $IMAGE | gzip -1 > glyph-image.tar.gz

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 0600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload deployment files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            deploy/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/"
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key" \
            glyph-image.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/glyph-image.tar.gz"

      - name: Capture live image for rollback
        id: live
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          image="$(ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker inspect glyph-api --format '{{.Image}}' 2>/dev/null || true")"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [[ -n "$image" ]]; then
            echo "rollback image: $image"
          else
            echo "no live API image; rollback will be skipped"
          fi

      - name: Load image and restart services
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "started=true" >> "$GITHUB_OUTPUT"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e
             cd '$DEPLOY_PATH'
             docker load < glyph-image.tar.gz
             rm -f glyph-image.tar.gz
             bash deploy/docker/run-stack.sh up"

      - name: Verify public health
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [[ -z "$HEALTHCHECK_URL" ]]; then
            echo "HEALTHCHECK_URL is not set; skipping public check"
            exit 0
          fi
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 "$HEALTHCHECK_URL"; then
              exit 0
            fi
            sleep 5
          done
          echo "health check failed: $HEALTHCHECK_URL" >&2
          exit 1

      - name: Roll back on failure
        if: failure() && steps.deploy.outputs.started == 'true' && steps.live.outputs.image != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ROLLBACK_IMAGE: ${{ steps.live.outputs.image }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e
             cd '$DEPLOY_PATH'
             docker tag '$ROLLBACK_IMAGE' glyph:rollback
             GLYPH_IMAGE=glyph:rollback bash deploy/docker/run-stack.sh up"
